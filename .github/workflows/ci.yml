name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-wasip1
          # Pin to the minimum version declared in Cargo.toml
          toolchain: "1.88.0"

      - name: Cache Cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test

      - name: Build WASM binary
        run: cargo build --release --target wasm32-wasip1

  generated-files-drift:
    name: Generated file drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-wasip1
          toolchain: "1.88.0"

      - name: Install cargo-anypoint
        run: |
          VERSION=$(grep CARGO_ANYPOINT_VERSION Makefile | head -1 | cut -d= -f2)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version string: $VERSION" && exit 1
          fi
          cargo install "cargo-anypoint@${VERSION}"

      - name: Regenerate asset files
        run: cargo anypoint build-asset-files

      - name: Fail if generated files differ from committed versions
        run: |
          if ! git diff --quiet src/generated/; then
            echo "Generated files in src/generated/ are out of sync with definition/gcl.yaml."
            echo "Run 'make build-asset-files' locally and commit the result."
            git diff src/generated/
            exit 1
          fi
